[package]
name = "diff-dirs-transfer-sync"
version = "0.5.0"
edition.workspace = true
description = "Explicit filesystem synchronization over diff-dirs records"
readme = "README.md"

[dependencies]
diff-dirs-tree-inspect = { path = "../../tree/inspect", version = "=0.5.0" }
diff-dirs-tree-compare = { path = "../../tree/compare", version = "=0.5.0" }
rayon = { version = "1.12.0", optional = true }
reflink-copy = "0.1.30"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[features]
native-dirent = ["diff-dirs-tree-inspect/native-dirent", "diff-dirs-tree-compare/native-dirent"]
parallel = ["dep:rayon", "diff-dirs-tree-inspect/parallel", "diff-dirs-tree-compare/parallel"]
