[package]
name = "diff-dirs-sync"
version = "0.1.0"
edition.workspace = true
description = "Explicit filesystem synchronization over diff-dirs records"
readme = "README.md"

[dependencies]
diff-dirs = { path = "..", version = "0.1.0" }
rayon = { version = "1.12.0", optional = true }
reflink-copy = "0.1.30"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[features]
parallel = ["dep:rayon", "diff-dirs/parallel"]
