[package]
name = "checked-control-before"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
diff-dirs = { path = "../before-source", features = ["parallel"] }
diff-dirs-sync = { path = "../before-source/sync", features = ["parallel"] }
rayon = "1.12.0"
