[package]
name = "diff-dirs-perf-runner"
version = "0.0.0"
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
