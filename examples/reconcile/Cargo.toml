[package]
name = "diff-dirs-examples-reconcile"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "reconcile"
path = "src/main.rs"

[features]
parallel = ["diff-dirs-transfer-sync/parallel", "diff-dirs-tree-compare/parallel"]
native-dirent = ["diff-dirs-transfer-sync/native-dirent", "diff-dirs-tree-compare/native-dirent"]

[dependencies]
diff-dirs-transfer-sync = { path = "../../transfer/sync", version = "=0.4.0" }
diff-dirs-tree-compare = { path = "../../tree/compare", version = "=0.4.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
