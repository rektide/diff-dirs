[package]
name = "diff-dirs-examples-cursor"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "cursor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
diff-dirs-tree-api = { path = "../../tree/api", version = "=0.3.0" }
facet = "=0.50.0-rc.5"
kopacetic-core = { path = "../../../kopacetic/crates/kopacetic-core", default-features = false }
kopacetic-rkyv = { path = "../../../kopacetic/crates/kopacetic-rkyv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
