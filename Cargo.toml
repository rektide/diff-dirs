[package]
name = "diff-dirs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Deterministic, metadata-based paired directory comparison"
readme = "README.md"

[workspace]
members = ["cli", "sync"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
parallel = ["dep:rayon"]
parallel-diagnostics = ["parallel"]
parallel-bench = ["parallel"]
