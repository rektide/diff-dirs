[package]
name = "diff-dirs"
version = "0.1.0"
edition.workspace = true
description = "Deterministic, metadata-based paired directory comparison"
readme = "README.md"

[workspace]
members = ["cli", "sync", "perf/runner", "perf/operation"]
resolver = "3"

[workspace.package]
edition = "2024"

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
parallel = ["dep:rayon"]
parallel-diagnostics = ["parallel"]
parallel-bench = ["parallel"]
