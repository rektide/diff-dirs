[package]
name = "diff-dirs-tree-compare"
version = "0.9.0"
edition.workspace = true
description = "Deterministic paired directory traversal and prefix summaries"
readme = "README.md"

[dependencies]
diff-dirs-tree-inspect = { path = "../inspect", version = "=0.9.0" }
rayon = { version = "1.12.0", optional = true }

[features]
native-dirent = ["diff-dirs-tree-inspect/native-dirent"]
parallel = ["dep:rayon", "diff-dirs-tree-inspect/parallel"]
parallel-diagnostics = ["parallel"]
parallel-bench = ["parallel"]
