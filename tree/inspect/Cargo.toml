[package]
name = "diff-dirs-tree-inspect"
version = "0.3.0"
edition.workspace = true
description = "Immediate directory inspection and validated comparison plans"
readme = "README.md"

[dependencies]
diff-dirs-tree-observe = { path = "../observe", version = "=0.3.0" }
rayon = { version = "1.12.0", optional = true }

[features]
native-dirent = ["diff-dirs-tree-observe/native-dirent"]
parallel = ["dep:rayon"]
