[package]
name = "diff-dirs-tree-api"
version = "0.7.0"
edition.workspace = true
description = "Deterministic, metadata-based paired directory comparison"
readme = "README.md"

[dependencies]
diff-dirs-tree-inspect = { path = "../inspect", version = "=0.7.0" }
diff-dirs-tree-compare = { path = "../compare", version = "=0.7.0" }
rayon = { version = "1.12.0", optional = true }

[features]
native-dirent = ["diff-dirs-tree-inspect/native-dirent", "diff-dirs-tree-compare/native-dirent"]
parallel = ["dep:rayon", "diff-dirs-tree-inspect/parallel", "diff-dirs-tree-compare/parallel"]
parallel-diagnostics = ["parallel", "diff-dirs-tree-compare/parallel-diagnostics"]
parallel-bench = ["parallel", "diff-dirs-tree-compare/parallel-bench"]
